<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3182ce" />

    <title>Distributed Panel</title>

      }
    </script>
  </body>
